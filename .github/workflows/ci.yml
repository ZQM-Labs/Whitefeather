name: ci
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -U pip ruff mypy bandit codespell pytest pre-commit
      - run: make lint || true
      - run: make format || true
      - run: make typecheck || true
      - run: make security || true
      - run: make spell || true
      - run: make test || true
